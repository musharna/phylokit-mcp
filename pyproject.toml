[project]
name = "phylokit-mcp"
version = "0.6.0"
description = "MCP server for phylogenetic inference — never returns a topology without its support"
readme = "README.md"
# GPL-2.0-ONLY, and the "only" is load-bearing. piqtree declares
# License-Expression: GPL-2.0-only (it wraps IQ-TREE 3), and GPL-2.0-only is
# INCOMPATIBLE with GPL-3.0 — the two cannot be combined and redistributed. This
# package imports piqtree directly, so the distributed combination must be
# GPL-2.0-only. cogent3, the other direct dependency, is BSD and imposes nothing.
license = "GPL-2.0-only"
# piqtree publishes wheels for 3.12+ only, and it is the engine. Claiming 3.11
# would mean claiming a Python the server cannot actually run on.
requires-python = ">=3.12"
authors = [{ name = "Jaret Arnold" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "phylogenetics",
    "iqtree",
    "bootstrap",
    "maximum-likelihood",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    # 2.x only. The 1.x floor was 1.28.1, a SECURITY floor rather than a feature
    # one; every 2.x release is above it, so nothing is lost by moving the range
    # rather than widening it. This package imports mcp.server.mcpserver, which
    # does not exist in 1.x, so a range spanning both majors could resolve to a
    # version that cannot import the server.
    "mcp>=2,<3",
    "piqtree>=0.8,<0.9",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/musharna/phylokit-mcp"
Repository = "https://github.com/musharna/phylokit-mcp"
Issues = "https://github.com/musharna/phylokit-mcp/issues"
Changelog = "https://github.com/musharna/phylokit-mcp/blob/main/CHANGELOG.md"

[project.scripts]
phylokit-mcp = "phylokit_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phylokit_mcp"]

[tool.hatch.build.targets.sdist]
# hatchling's `packages` covers the WHEEL ONLY. Without an explicit allow-list
# the sdist packs .claude/ and docs/. Verify with `tar tzf`, not `git ls-files`.
include = [
    "src/**",
    "tests/**",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "LICENSE",
    "CITATION.cff",
    "NOTICE",
    "pyproject.toml",
]
exclude = [".claude", "docs", "dist"]

[tool.ruff]
# ruff formats Python code blocks embedded in Markdown; docs/ holds the design
# record, whose quoted snippets must not be rewritten.
extend-exclude = ["docs"]

[dependency-groups]
# jsonschema validates server.json against the registry's own published schema
# (vendored at tests/server.schema.json) so registry-side constraints fail here
# rather than in the publish workflow, which only runs once the tag is cut.
dev = ["pytest>=8.0", "ruff>=0.6", "jsonschema>=4.0", "mypy>=1.11"]

[tool.mypy]
# Matches requires-python (>=3.12) and the CI matrix. Checking at 3.11 made
# mypy fail to PARSE piqtree, which uses PEP 695 type-parameter syntax.
python_version = "3.12"
plugins = ["pydantic.mypy"]
# The MCP types are pydantic models with a camelCase alias_generator and
# populate_by_name, so `ToolAnnotations(read_only_hint=...)` is correct at
# runtime and the field IS snake_case. Without the plugin mypy reads only the
# alias-based signature and demands `readOnlyHint`, which would be a wire-format
# spelling pushed into source to satisfy a checker that was mis-modelling it.
warn_unused_ignores = true

# Scoped rather than global: these two publish no stubs and no py.typed. A
# blanket ignore_missing_imports would also have swallowed the `mcp` resolution
# failure that turned out to be mypy running outside the project environment --
# a real problem hiding behind a setting meant for third-party gaps.
[[tool.mypy.overrides]]
module = ["cogent3.*"]
ignore_missing_imports = true

[tool.mutmut]
source_paths = ["src"]
