version: 2
# Nothing proposed dependency updates in this repo before now, so pins could drift
# silently and a deprecation deadline would arrive unwarned.
#
# `uv`, not `pip`: this project is uv-locked. Dependabot's uv ecosystem (GA March
# 2025) reads pyproject.toml and uv.lock together; the pip ecosystem would update
# pyproject and leave uv.lock stale, which CI installs with --frozen and would fail.
#
# Minor/patch are grouped to keep PR volume low. Majors arrive individually -- those
# carry the runtime bumps and deserve their own CI run. These are proposals for a
# human to judge, NOT auto-merge candidates: a dependabot PR on a sibling repo once
# proposed widening an intentionally-narrow major bound and would have broken the
# build.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      uv-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # numpy is capped BELOW its latest release by this project's own dependency
      # chain: piqtree requires cogent3, and every cogent3 in range requires
      # numpy<2.5. Our direct `numpy>=1.26` therefore has an effective ceiling it
      # does not state, and Dependabot proposing numpy 2.5.x makes the whole uv
      # job fail with dependency_file_not_resolvable rather than skip the package.
      #
      # NOT capped in pyproject.toml on purpose. Duplicating cogent3's ceiling
      # there would silently drift the moment cogent3 raises it -- the same
      # reasoning that keeps opencv-python uncapped in the sibling plantcv-mcp.
      # Drop this entry once cogent3 admits numpy>=2.5.
      - dependency-name: "numpy"
      # piqtree is the inference engine and its range (>=0.8,<0.9) is deliberate.
      # Bumping it is a tested act -- it changes what IQ-TREE does -- so it belongs
      # in a human-authored PR rather than an automated one.
      #
      # Correction to the previous revision of this comment: it claimed the split
      # `python_full_version >= '3.14' and sys_platform == 'win32'` had "no piqtree
      # distribution at all". That is FALSE -- piqtree 0.8.3 publishes cp314
      # win_amd64 wheels. The claim came from reading a TRUNCATED error message
      # whose visible portion happened to name piqtree; the full resolver output
      # shows the conflict is numpy vs cogent3, which is why ignoring piqtree
      # alone did not fix the job.
      - dependency-name: "piqtree"
