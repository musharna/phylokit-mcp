name: Bug report
description: Report a bug in phylokit-mcp
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please do **not** report security vulnerabilities here —
        see [SECURITY.md](../SECURITY.md) for private disclosure.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      multiple: true
      options:
        - infer_tree
        - select_substitution_model
        - compare_trees
        - simulate_alignment
        - capabilities
        - not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pip show phylokit-mcp` (or the version `uvx` pulled).
      placeholder: "0.4.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: false
  - type: input
    id: seqtype
    attributes:
      label: sequence_type and model
      description: The molecule type is declared, never inferred — state which you passed.
      placeholder: "dna, GTR+G"
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact tool call and arguments. Include the input you fed it.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Paste the error or traceback in full. Include the alignment size (taxa x sites); inference cost scales with both.
      render: shell
    validations:
      required: false
